##
## Default strfry config
##

# Directory where strfry stores its data
db = "./strfry-db/"

dbParams {
    # Maximum number of threads/processes that can simultaneously have DB transactions open
    maxreaders = 256

    # Size of mmap() to use when accessing the DB (default is 10GB, this is the maximum DB size)
    mapsize = 10995116277760
}

relay {
    # Interface to listen on. Use 0.0.0.0 to listen on all interfaces
    bind = "0.0.0.0"

    # Port to listen on
    port = 7777

    # Set OS-limit on maximum number of open files/sockets (0 means don't change)
    nofiles = 0

    # HTTP response header in non-websocket requests
    realIpHeader = ""

    info {
        # NIP-11: Informational document
        name = "strfry dodo-box relay"
        description = "A local Nostr relay for dodo-box"
        pubkey = ""
        contact = ""
    }

    # Maximum connections that can be made from a single IP
    maxIpsPerRequest = 0

    # Websocket-specific settings
    websocket {
        # Maximum size of incoming websocket messages (bytes)
        maxMessageSize = 131072
    }
}

events {
    # Maximum number of events to keep (oldest evicted first)
    maxNumEvents = 1000000

    # Maximum size of event content field (0 = no limit)
    maxEventSize = 65536

    # Events with created_at older than this will be rejected (seconds)
    # NIP-59 gift wraps use now(5) which drifts up to 100000s (~28h) into the past
    # Set to 604800 (7 days) to accommodate NIP-59 timestamp randomization
    rejectEventsOlderThanSeconds = 604800

    # Events with created_at newer than current time plus this will be rejected (0 = no limit, seconds)
    rejectEventsNewerThanSeconds = 900

    # If non-empty, only events signed by these pubkeys are allowed
    whitelist = []

    # If non-empty, events signed by these pubkeys are blocked
    blacklist = []
}
