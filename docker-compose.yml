services:
  relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: dodo-box-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - relay-data:/app/strfry-db
      - ./docker/strfry.conf:/app/strfry.conf:ro
    command: ["--config", "/app/strfry.conf", "relay"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7777 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    image: dodo-box:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dodo-box-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:18300:3000"
    environment:
      - NEXT_PUBLIC_DEFAULT_RELAYS=ws://relay:7777
      - NEXT_PUBLIC_VAULT_SALT=dodobox-vault-v1
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      relay:
        condition: service_healthy

  site:
    image: nginx:alpine
    container_name: dodo-box-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:18301:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
    driver: local
