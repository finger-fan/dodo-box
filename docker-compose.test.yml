services:
  relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: dodo-box-relay-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:7778:7777"
    volumes:
      - relay-test-data:/app/strfry-db
      - ./docker/strfry.conf:/app/strfry.conf:ro
    command: ["--config", "/app/strfry.conf", "relay"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7777 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  relay-test-data:
    driver: local
